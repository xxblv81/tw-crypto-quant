# ============================================================
# 兩個市場的參數定義 — 這是市場分離的單一事實來源
# 所有程式（Pine 註解、Python 掃描器、回測）都以此為準
# 改參數改這裡，不要散在各檔案
# ============================================================

meta:
  strategy: bollinger-squeeze-breakout
  version: 4
  note: |
    同一套進場邏輯，兩個市場用不同參數。
    核心差異在停損寬度與量能過濾，原因見各市場的 rationale。

# ─────────────────────────────────────────────
crypto:
  label: 加密貨幣
  status: validated          # validated | marginal | rejected
  exchange: BINANCE
  timeframe: 4H              # 已驗證；1D 亦可但樣本較少
  symbols_validated: [BTCUSDT, ETHUSDT]

  costs:
    commission_pct_per_side: 0.05
    slippage_ticks: 1
    initial_capital: 10000
    currency: USDT

  params:
    bb_length: 20
    bb_mult: 2.0
    bbw_lookback: 20         # 掃描 20~100 全段 PF ≥ 1.40，20 為最佳
    squeeze_window: 20
    require_expanding: true
    entry_mode: upper_break  # upper_break | mid_reclaim
    # 2026-09-24：最高價判定實測較差（BTC 新出場下 Sharpe IS 0.88→0.68、OOS 1.66→1.06），預設關
    break_on_high: false     # true = 最高價（含上影線）穿過上軌即算突破；false = 收盤穿越
    require_touch_lower: false
    touch_window: 10
    trend_filter: true       # 關掉會讓 PF 1.46→1.12、回撤翻倍
    trend_ma_length: 200
    # ── 第二層趨勢濾網（2026-09-02 新增）──
    # 單位是「根數」不是天數：4H 圖上 60 根 ≈ 10 天。
    # 實測 60 根：BTC PF 1.799→1.870、ETH 0.933→0.982，兩標的同向小幅改善。
    # 若改成 360 根（＝真正的 60 天）反而變差：BTC →1.388、ETH →0.782。
    trend_filter_2: true
    trend_ma2_length: 60
    # ── 做空（2026-09-02 加入功能，預設關閉）──
    # 程式已完整支援，但實測兩個標的都虧：
    #   BTC 多空並行 PF 1.799→1.229、回撤 10.9%→31.5%；純做空 PF 0.790
    #   ETH 多空並行 PF 0.933→0.943、回撤 36.3%→61.0%；純做空 PF 1.021 但報酬 -4.64%
    # 加了第二層濾網也救不回來。要開就改這一行，Pine 端同步改 useShort。
    allow_short: false
    allow_long: true
    volume_filter: true      # 主要作用是壓低回撤 17.0%→9.3%
    volume_ma_length: 20
    volume_mult: 1.5
    atr_length: 14
    stop_atr: 2.0
    # ── 出場（2026-09-24 改）── 固定 2R 停利會砍掉贏家，是 Sharpe 低的主因。
    # 改成「收盤跌破 MA20（＝布林中線）→ 下一根開盤出場」，ATR 停損保留。
    # 2018~2023 / 2024~2026 逐根盯市 Sharpe：BTC 0.03→0.88 / 0.89→1.66、ETH 0.68→0.97 / −0.07→0.90。
    # MA10~100 全段都勝過 2R 停利（高原，不是挑點），詳見 crypto/SHARPE_RESULTS.md
    take_profit: false
    rr: 2.0                  # take_profit=false 時不使用
    exit_ma: 20
    exit_next_open: true     # 跌破後下一根開盤成交（與 TV strategy.close 一致）
    trailing: false          # 開啟會砍掉贏家 PF 1.44→1.36
    trail_trigger_atr: 2.0
    trail_offset_atr: 1.0
    long_only: true          # 做空實測大幅虧損，已從程式碼移除

  benchmark:
    symbol: BTCUSDT
    timeframe: 4H
    period: 2024-01~2026-08
    net_profit_pct: 60.20
    max_drawdown_pct: 11.86
    win_rate_pct: 50.00
    profit_factor: 1.713
    trades: 48

  rationale: |
    24 小時交易、無漲跌幅限制、成本低（來回 0.1%）、波動大。
    突破當下能真實成交，量能是真實買盤，2 ATR 停損足夠寬。

# ─────────────────────────────────────────────
taiwan:
  label: 台股
  status: marginal
  exchange: TWSE             # 上市；上櫃為 TPEX
  timeframe: 1D
  symbols_validated: [2330, 2317, 2454, 2382, 3231, 0050, 2412, 2881]

  costs:
    # 手續費 0.1425% x2 + 賣出證交稅 0.3% ≈ 來回 0.585%
    commission_pct_per_side: 0.3
    slippage_ticks: 2
    initial_capital: 1000000
    currency: TWD

  params:
    bb_length: 20
    bb_mult: 2.0
    bbw_lookback: 20
    squeeze_window: 20
    require_expanding: true
    # ── 兩段式進場（2026-09-09）──
    #   ① 縮口後收盤向上穿越中線 → 進入候選狀態
    #   ② 之後 mid_cross_window 根內出現「帶量表態紅K」才進場
    #   期間收盤須維持在中線之上，跌破即作廢。
    # 全市場 1,027 檔實測 vs 現行上軌突破：
    #   PF 1.363 → 1.408｜中位報酬 14.9% → 18.1%｜回撤 44.4% → 43.1%｜訊號量 +24%
    # ★ 舊註記「mid_reclaim 實測無效」是 9 檔未除權息還原時測的，且把三個條件
    #   壓在同一根 K 棒上。改成兩段式後結論相反。
    entry_mode: mid_confirm
    # 候選有效期。實測峰值在 30：5根 1.312／10根 1.406／30根 1.483／60根 1.439／不限 1.437。
    # 完全不限反而變差 —— 會抓到「站上中線半年後才放量」那種已走完一段的。
    mid_cross_window: 30
    mid_confirm_min_gap: 1     # 1 = 穿越當根不算，要「之後」出現的紅K
    expand_mult: 0             # 帶寬須張開到縮口時 N 倍。★ 實測有害，維持關閉
    require_touch_lower: false
    touch_window: 10
    trend_filter: true
    # 2026-09-02 由 200 改為 20。使用者的目標是「每天有更多可買訊號」。
    #
    # ★ 關鍵區別：回測期間的「累計交易數」與「今天看到幾檔」方向相反。
    #   MA60 七年累計交易數較多（轉向快、能吃到新趨勢第一段），
    #   但在任何單一時點反而較嚴格（貼股價近，拉回就跌破）→ 當日訊號最少。
    #   實測當日訊號數：MA20 204／MA60 136／MA120 147／MA200 171／MA240 175
    #
    # 全市場回測（951~993 檔）PF 幾乎持平，均線長度差 12 倍只在 1.34~1.39 間：
    #   MA20 1.358／MA60 1.341／MA120 1.365／MA200 1.369／MA240 1.388
    # 代價是回撤，這條是乾淨的單調關係：MA20 44.4% → MA240 39.1%。
    # 選 20 = 用 +4.9 個百分點的回撤，換 +19% 的當日訊號量。
    trend_ma_length: 20
    # 表態紅K：收紅即可。加「實體>50%」「收高檔>60%」實測都變差（1.262／1.234），故不設
    require_bull_candle: true
    # ★ 量能過濾在兩段式下由有害轉為有益 —— 舊結論是把量能壓在「穿越當根」造成的，
    #   穿越當根往往量還沒出來，自相矛盾。改成「確認訊號」後 1.2 倍是峰值：
    #   1.0倍 PF 1.387／1.2倍 1.408／1.5倍 1.353
    volume_filter: true
    volume_ma_length: 5
    volume_mult: 1.2           # 相對 5 日均量
    # 第二道量能：相對「穿越中線以來」的均量。只比 5 日均量不夠 ——
    # 若整段候選期都在放量，那這根就不算表態。實測 1.0~1.2 是高原：
    #   關閉 1.483／×1.0 1.501／×1.2 1.500／×1.3 1.492／×1.5 1.480
    #   （×2.0 的 1.518 是孤立高點，依方法論判定為雜訊，不採用）
    volume_since_cross_mult: 1.2
    # 多頭排列。★ 這是全專案對回撤改善最大的單一改動：45.2% → 33.5%。
    # 必須用長天期：5>10>20 只有 1.360、5>10>20>60 是 1.336，都比不加還差；
    # 短均線排列變化太快抓到的是雜訊，長均線才代表真正的趨勢結構。
    ma_stack: [20, 60, 120]
    atr_length: 14
    stop_atr: 4.0            # ★ 與 crypto 最大差異：2→4 讓中位數 PF 0.72→1.09
    take_profit: true
    rr: 2.0
    trailing: false
    trail_trigger_atr: 2.0
    trail_offset_atr: 1.0
    long_only: true

  # ── 出場設定檔（2026-09-02）──
  # 選股清單同時輸出兩組出場價位，由使用者自行決定每檔要做中線還是長線。
  # 持有天數只由 stop_atr 決定，與股票大小無關（Q1~Q4 實測皆同）。
  #
  # ★ 沒有「短線」設定檔：stop_atr=2 中位持有僅 6~8 天，
  #   台股來回成本 0.585% 會吃光邊際 → PF 0.960 / 1.030、中位報酬 −12.7% / −8.3%。
  #   （同樣的事在動能策略的 MA5 出場上也發生過，兩次獨立驗證。）
  profiles:
    mid:                       # 中線
      stop_atr: 4.0
      rr: 2.0
      median_hold_days: 32     # 實測 712 檔固定樣本中位數
      median_pf: 1.386
    long:                      # 長線
      stop_atr: 6.0
      rr: 3.0
      median_hold_days: 93
      median_pf: 2.117
      note: |
        PF 較高，但有一部分是「抱越久越接近買進持有」的 beta，不是純 alpha。
        同期同批標的買進持有中位報酬 367%，長線設定僅 65.5%。

  benchmark:
    scope: 9 檔權值股中位數
    period: 各標的完整歷史
    median_profit_factor: 1.094
    improved: 8/9
    above_one: 6/9
    median_max_drawdown_pct: 36

  rationale: |
    漲跌幅 10% 限制讓突破當天常鎖漲停買不到，量能反而萎縮 → 量能過濾失效。
    日線波動遠小於加密貨幣，2 ATR 會被日常雜訊掃掉 → 需 4 ATR。
    來回成本 0.585%，是加密貨幣的 6 倍，邊際被吃掉一成以上。

  caveats:
    - 中位數 PF 1.094 僅勉強過線，非可安心交易水準
    - 回撤惡化，個別標的達 50~56%
    - 每檔樣本僅 12~21 筆，統計信心低
    - stop_atr=4.0 是第一個試的值，未掃描 3/5/6
    - 驗證標的全為大型權值股，中小型股未經測試
    - 回測未處理「突破當天鎖漲停買不到」的情境，可能高估
    - 未確認 TradingView 台股資料是否為除權息還原股價

# ─────────────────────────────────────────────
# 動能選股（對標 CMoney「愛德恩動能選股」）
#
# ★ 這是另一套策略，與上面的布林縮口突破無關，共用的只有資料層。
#   原始 App 的動能分數公式未公開（付費 App，官方只說「找動能 > 7.5 分」），
#   下面是依其公開描述重建的透明版本，不是還原原始公式。
#   公開可查的部分只有三條：動能分數門檻 7.5、投信連買、跌破五日線停損。
#
# 評分為「橫斷面」：每個交易日拿全市場（過流動性門檻者）互相排名，
# 所以分數是相對的 —— 7.5 分永遠代表「當天市場前 25% 強度」，不隨多空頭漂移。
taiwan_momentum:
  label: 台股動能選股
  status: marginal            # validated | marginal | rejected | untested
  # 2026-09-02 全市場回測完成，見 taiwan/MOMENTUM_RESULTS.md。
  # 分數有鑑別力（門檻 3→9.5，PF/勝率/平均報酬三者單調上升），
  # 但作者公開的「跌破五日線就停損」這條在台股日線是虧的 —— 已改為 MA20。
  exchange: TWSE
  timeframe: 1D

  costs:
    commission_pct_per_side: 0.3     # 同 taiwan：手續費 x2 + 證交稅，來回約 0.585%
    initial_capital: 1000000
    currency: TWD

  params:
    # ── 流動性門檻（先過濾再排名）──
    # 不先濾就排名會讓殭屍股佔掉百分位，動能分數失去意義。理由同 screen.py 的 --min-turnover。
    min_turnover: 20000000             # 20 日均成交金額下限 (TWD)
    turnover_window: 20

    # ── 分數組成（權重加總須為 1.0）──
    weights:
      # ★ rs 權重實測不敏感：0.0~0.6 之間 PF 都落在 1.30~1.36（見 RS 敏感度報告）。
      #   0.40 保留原值，不是因為它最好，是因為這個數字沒有差別。
      rs: 0.40                       # 相對強度：多期報酬的全市場百分位
      volume: 0.20                   # 量能動能：5 日 / 60 日均成交金額
      align: 0.20                    # 均線多頭排列：規則式，非百分位
      position: 0.20                 # 位階：距 52 週高點多遠

    # RS 多期報酬權重（加總須為 1.0）。三段都要強才拿得到高分。
    #
    # ★ 2026-09-02 敏感度分析後改過（原為 {20: .40, 60: .35, 120: .25}）。
    #   完整結果見 taiwan/MOMENTUM_RS_SENSITIVITY.md，兩個結論：
    #   1) weights.rs 的數值幾乎不影響績效 —— 0.0~0.6 之間 PF 都在 1.30~1.36，
    #      只有拉到 0.85 以上才明顯變差（1.197 / 1.144）。0.40 不是調出來的，是「不敏感」。
    #   2) 真正有影響的是**回看期間**，而且越長越好。把最短的 20 日換掉之後，
    #      在「當天前 2.5% / 5%」兩個嚴格度下 PF 都跳升，25 檔投組的 CAGR 也一致改善：
    #        回看期        PF@前2.5%  PF@前5%   CAGR@25檔/前5%
    #        20/60/120      1.345     1.311        23.2%   ← 原設定
    #        20/60/240      1.412     1.376        34.0%
    #        60/120/240     1.414     1.380        30.1%   ← 現採用
    #        120/240        1.409     1.397        17.3%
    #      三個長版本互相接近，代表「拿掉 20 日」才是關鍵，不是某個特定組合。
    #      這與動能因子文獻一致：一個月是反轉，一年才是動能。
    #   ★ 副作用：需要 240 個交易日的歷史，上市未滿一年的新股會被排除在外。
    rs_lookbacks: {60: 0.3333, 120: 0.3333, 240: 0.3334}

    vol_fast: 5
    vol_slow: 60

    ma_set: [5, 10, 20, 60]          # 多頭排列用；同時是出場均線的來源
    ma_slope_lookback: 5             # MA60 是否較 5 日前上揚

    high_window: 250                 # 52 週高（台股一年約 245 個交易日）
    position_floor: 0.70             # 距高點 30% 以外 = 0 分，貼著高點 = 10 分

    # ── 籌碼：投信連買（2026-09-02 已建快取並掃描完，見 taiwan/MOMENTUM_CHIPS.md）──
    # 結論：**弱正面**。當分項有小幅幫助，當硬過濾則不划算。
    #   A 當分項：權重 0→0.30 時 PF 由 1.380 單調升到 1.458，但每筆平均報酬反而
    #     由 +1.90% 降到 +1.62%，CAGR 在 0.10~0.20 之間見頂。取 0.15。
    #   B 連買天數：2/3/5/10 天差異在 1.396~1.424 之間，不敏感。取 3
    #     （與作者「建議超過 1 天」一致，長連買反而是舊資訊）。
    #   C 當硬過濾：對照「同筆數但價量更嚴格」的組別，籌碼只贏 +0.001 ~ +0.119 PF，
    #     而且每筆平均報酬全數落後（1.65~2.08% vs 2.23~2.88%）。**不要當過濾用。**
    #   D 單獨用籌碼選股：PF 只有 1.12~1.18，遠低於動能的 1.4+。它不是獨立策略。
    #   ★ 副作用：開啟後榜單會明顯變短。多數個股當天投信沒動作＝籌碼分 0，
    #     總分被拉低。實測 2026-09-01：≥8.5 分由 32 檔掉到 11 檔。
    #     純粹當「看動能高低」的雷達用時，建議把門檻降到 8.0（22 檔）或
    #     直接用 --min-score 7.5（35 檔），不然每天只剩十來檔可看。
    use_chips: true
    chips_weight: 0.15               # 開啟時，其餘四項權重等比例縮到 0.85
    chips_max_days: 3                # 連買 3 天以上即滿分

    # ── 進出場（依愛德恩公開說法）──
    # entry_score：7.5 是原作者的說法，但實測 PF 隨門檻單調上升
    # （MA20 出場：7.5→1.284、8.5→1.374、9.0→1.367），8.5 是「還有 6,621 筆
    # 樣本」與「PF 已進入平台」的交會點。不是掃出來的單峰，是單調曲線上的取點。
    entry_score: 8.5                 # 分數上穿此值 → 隔日開盤進場
    # ★ exit_ma：原作者公開規則是 5 日線，實測是整個網格裡最差的一格 ——
    #   中位持有只有 4 天，毛 PF 1.19 全被 0.6% 來回成本吃光（淨 PF 0.947、投組 CAGR −22%）。
    #   放寬到 MA10/20/60 時 PF 單調改善，且三個進場門檻下同向，屬結構性效果非擬合。
    #   選 20 而非 60：MA60 每筆品質最好（PF 1.933）但持有 35 天，
    #   8 個持股位置下只吃得到 302/4377 筆，投組 CAGR 反而較低（36.7% vs 55.5%）。
    exit_ma: 20                      # 收盤跌破 20 日線 → 隔日開盤出場
    stop_loss_pct: 20                # 硬停損 −20%（作者說「停損不超過 20%」）
    max_hold_days: 0                 # 0 = 不限；設 N 則最多持有 N 個交易日
    limit_up_guard: true             # 隔日鎖漲停買不到 → 略過該筆（同 taiwan）

  benchmark:
    scope: 全市場 1,083 檔（含期間內下市，無倖存者偏差）
    period: 2019-01-02 ~ 2026-09-01
    entry_score: 8.5
    exit_ma: 20
    rs_lookbacks: 60/120/240 等權       # 2026-09-02 敏感度分析後改的
    trades: 5476
    win_rate_pct: 35.08
    profit_factor: 1.436
    avg_net_pct_per_trade: 2.201
    median_hold_days: 13
    # ★ 投組 CAGR 不要只看單一持股數 —— 8 檔那格是抽樣運氣。
    #   舊配置在 5~30 檔之間從 28% 跳到 55%，新配置穩在 27~37%。
    #   合理期望值講「約 35%」，不要講 55%。
    portfolio:
      cagr_pct_range_5_to_30_slots: [27.2, 36.8]
      cagr_pct_reference_15_slots: 36.8
      max_drawdown_pct_range: [37.0, 49.3]   # ★ 仍是最大的未解問題
      note: 固定 1/slots 部位、不計滑價，只計手續費與證交稅

  rationale: |
    原策略是「強者恆強」的順勢法：只買正在動的，不動就換。
    因此評分刻意做成橫斷面相對排名而非絕對門檻 —— 絕對門檻（例如「漲 20%」）
    在多頭全部通過、空頭全部不通過，會變成擇時而不是選股。

  caveats:
    - 動能分數公式為重建版，非 CMoney 原始公式，兩者分數不可互相對照
    - 最大回撤 50.4%，比布林縮口的 35~40% 更糟，這是目前最該解的問題
    - 全部為 in-sample：門檻與出場均線都是在同一段 2019~2026 上挑的，未做樣本外
    - 勝率僅 34%，靠 8.15% 平均獲利 / −4.08% 平均虧損的賠率取勝 → 心理上很難執行
    - 投組模擬用固定 1/slots 部位、不計滑價，只計手續費與證交稅
    - 籌碼（投信連買）尚未納入 —— use_chips 為 false，快取未建
    - 未做產業／族群分散，8 個位置可能同時壓在同一族群上

# ─────────────────────────────────────────────
# 個股期貨模式（2026-09-02 新增）
#
# 同一套動能分數，換成用個股期進場。三個結構性差異：
#   1. 宇宙小很多 —— 只有 237 檔有個股期，日成交 >500 口的只有約 103 檔
#   2. 成本低一個數量級 —— 期交稅 0.002%/邊 vs 現股證交稅 0.3%（賣出）
#   3. 有槓桿 —— 保證金 13.5% / 16.2% / 20.25% 三級距，對應 7.4x / 6.2x / 4.9x
#
# ★ 但實測：成本降低**沒有**讓短持有翻身。毛 PF 本來就隨持有期單調上升
#   （MA5 1.406 / MA10 1.830 / MA20 2.474），成本只是把 MA5 壓到 1 以下而已。
#   結論見 taiwan/MOMENTUM_FUTURES.md。
taiwan_futures:
  label: 台股個股期貨
  status: marginal
  exchange: TAIFEX
  timeframe: 1D

  costs:
    # 期交稅 0.002%/邊 + 手續費約 0.015%/邊 + 價差滑價。
    # 0.05 是中性假設；流動性差的契約價差會遠高於此，所以務必配合 ssf_min_volume。
    commission_pct_per_side: 0.05
    initial_capital: 1000000
    currency: TWD

  params:
    contract_size: 2000              # 一口 = 2,000 股（ETF 期為 10,000，本專案不收）
    ssf_min_volume: 500              # 選股時的契約日成交口數下限（>500 口約 103 檔）
    # 回測用的 point-in-time 流動性代理：當時 60 日均成交金額的全市場排名前 N。
    # ★ 不能用「今天有量的個股期清單」去篩過去 —— 那是前視偏誤，實測會把
    #   MA20 的 PF 從 1.711 灌水到 2.428。
    pit_universe_rank: 150
    entry_score: 8.5
    exit_ma: 20
    stop_loss_pct: 20

    # ── ★ 進場位置：距 52 週高點的上限（2026-09-04 新增）──
    # 這是目前找到最乾淨的「增額收益」來源：CAGR 幾乎不變，回撤大幅下降。
    #     距高上限   筆數   PF     勝率    平均/筆   CAGR    回撤
    #       無      2052  1.465  41.4%   1.92%   72.9%  43.1%
    #      ≤10%    1914  1.492  42.1%   2.01%   71.0%  38.9%
    #      ≤6%     1672  1.565  43.4%   2.30%   69.3%  40.8%
    #      ≤4%     1422  1.715  45.5%   2.79%   69.9%  30.5%   ← 採用
    #      ≤2%     1025  1.671  46.1%   2.68%   58.3%  31.9%
    # PF 單調升到 4% 才回落（樣本變薄），4% 是曲線轉折處不是單點最大值。
    #
    # ★★ 順帶推翻一個直覺：「下檔有限（離支撐近）」在這套策略裡是**反指標**。
    #   依進場價距 MA20 分五桶，PF 單調遞增（最近 1.000 → 最遠 1.665）：
    #     離 MA20 最近那桶 盈虧比 2.12 最高，但勝率只有 32.1%，PF 剛好 1.000 = 白做。
    #     離 MA20 最遠那桶 盈虧比 1.84 最低，但勝率 47.4%，PF 1.665。
    #   **盈虧比單獨看是陷阱** —— 它高的地方勝率會崩掉。強勢股就是要買在強的位置。
    near_high_pct: 4.0

    # ── 短線窗口（3~14 天）──
    # 這是刻意加的硬性上限，不是最佳化出來的。目的是把持有期壓進 3~14 天。
    # 實測 max_hold=14 時 93% 的交易落在 3~14 天內（不設限只有 52%）。
    #
    # ★ 這個限制是有代價的，不要以為是免費的：
    #     出場 MA20，不設上限   PF 1.613　CAGR@25 25.5%　回撤 31.3%
    #     出場 MA20，上限 14 天  PF 1.344　CAGR@25 18.4%　回撤 24.0%
    #   PF 少 17%、CAGR 少 28% —— 因為砍掉的都是還在漲的贏家。
    #   但回撤同步降低（31.3%→24.0%）、勝率上升（36.9%→39.8%），
    #   所以風險調整後只差約 7%（CAGR/回撤 0.82 → 0.76），拉槓桿可以補回來。
    #
    # 出場均線仍用 20 而非 10 或 5：在 14 天上限下 MA20 (PF 1.344) > MA10 (1.308) > MA5 (1.208)。
    # 「抱不久」跟「用短均線出場」是兩件事，前者是限制、後者會讓你被雜訊掃出去。
    max_hold_days: 14

    # 啟動觸發（選配）：要求進場當天同時出現布林縮口突破（沿用 taiwan 的參數）。
    # 在 14 天上限下每筆更好（PF 1.397 vs 1.344、勝率 42.7% vs 39.8%），
    # 但筆數只剩 710 vs 2,628，填不滿部位 → 同樣回撤下反而輸：
    #   ① 純動能 15檔@1.5x  CAGR 40.4% 回撤 45.4%
    #   ② 加縮口 15檔@3.0x  CAGR 35.0% 回撤 45.0%
    # 想少做交易、盯少一點部位才開它。
    require_squeeze_breakout: false

    # ── 槓桿與分散 ──
    # ★ 滿倉 7.4x 實測最大回撤 98.8%，等於歸零。
    #   真正壓回撤的是分散不是降槓桿。短線配置（MA20 + 14 天上限）實測：
    #     15檔 1.0x  CAGR 26.0%  回撤 32.9%
    #     15檔 1.5x  CAGR 40.4%  回撤 45.4%   ← 預設
    #     25檔 2.0x  CAGR 38.7%  回撤 42.7%   ← 風險調整略好，但要盯 25 個部位
    #     25檔 2.5x  CAGR 49.5%  回撤 50.4%
    max_leverage: 1.5
    slots: 15

    # ── ★ 依大盤狀態動態調整槓桿（2026-09-04）──
    # 部位大小在**進場當下**由當時的大盤狀態決定，之後不隨狀態變化調整
    #（貼合實務：你是下單當下決定口數，不是每天重算）。
    # 狀態定義見 markets.yaml[taiwan_market]。
    #
    # 實測（15 檔等權、PIT 前 150 大、含籌碼）：
    #   固定 1.5x（舊預設）        CAGR 42.6%  回撤 48.0%  比值 0.89
    #   固定 2.0x                 CAGR 59.0%  回撤 58.6%  比值 1.01
    #   弱0 / 中1.5 / 強2.5       CAGR 72.9%  回撤 43.1%  比值 1.69   ← 採用
    #   弱0 / 中2.0 / 強3.0       CAGR 94.5%  回撤 50.3%  比值 1.88
    # 採用的這組在 CAGR 與回撤**兩個軸上都勝過舊的固定 1.5x**，不是取捨。
    # 沒有選比值最高的 弱0/中2/強3，是因為它的回撤 50.3% ——
    # 而本模擬未含追繳斷頭，50% 的路徑在真實個股期上可能直接出局。
    # ── ★ 契約規模與口數整除：回測看不到、但實際會擋住你 ──
    # ★★ 契約規模有兩種，差 20 倍（2026-09-04 修正，先前一律用 2,000 是錯的）：
    #       一般股票期貨  一口 = 2,000 股
    #       小型股票期貨  一口 =   100 股   ← 契約名稱含「小型」，107 檔可用標的裡有 32 檔
    #   逐檔取 futures.py 快取的 contract_size，不要用單一常數。
    #
    # 正確的分布（近 500 交易日、≥8.0 分且有個股期的候選）：
    #     一口名目    中位 158,893　最大 2,360,000
    #     一口保證金  中位  30,166　25% 15,341　75% 64,210　最大 477,900
    #
    # 25 萬保證金預算、每日最多新進 1 檔的實測（含大盤動態槓桿）：
    #     同時上限   CAGR    回撤    平均曝險
    #         1     42.1%   98.3%    68.9%   ★★ 等於歸零，絕對不要
    #         2     88.1%   80.8%    65.0%
    #         5     77.4%   58.0%    46.6%
    #         8     63.5%   25.2%    24.9%   ← 風險調整最佳
    #        15     21.6%    7.6%     7.8%
    # ★ 「一天最多進一檔」是安全的（中位持有 13 天，會自然累積到十幾檔）；
    #   「同時只持有一檔」才是危險的 —— 單一部位在 1.5~2.5x 下沒有任何分散。
    use_regime: true
    regime_leverage: {0: 0.0, 1: 1.5, 2: 2.5}   # 0 弱 / 1 中 / 2 強；0.0 = 不進新倉

  benchmark:
    # 重現：cd taiwan/python && ./.venv/bin/python momentum_backtest.py --futures
    scope: point-in-time 前 150 大（個股期資格代理）
    period: 2019-01-02 ~ 2026-09-03
    config: entry 8.5 / 出場 MA20 / 持有上限 14 天 / 距高 ≤4% / 含籌碼 / 成本 0.05%每邊
    trades: 1422
    win_rate_pct: 45.5
    profit_factor: 1.715
    avg_net_pct_per_trade: 2.79
    median_hold_days: 13
    pct_trades_in_3_to_14_days: 93
    portfolio_15_slots:
      avg_exposure_pct: 60           # ★ 四成時間是空手的，看回撤要一起看這個
      dynamic_regime: {cagr_pct: 69.9, max_dd_pct: 30.5}   # 弱0/中1.5/強2.5，實際採用
      fixed_leverage_3x: {cagr_pct: 109.3, max_dd_pct: 48.6}
    by_year_pf: {2020: 1.70, 2021: 1.41, 2022: 0.57, 2023: 1.63,
                 2024: 1.03, 2025: 1.88, 2026: 1.78}

  caveats:
    - ★ 14 天上限砍掉的都是還在漲的贏家 —— PF 由 1.613 降到 1.344，這是短線窗口的代價
    - ★ 槓桿模擬用固定比例部位，**沒有模擬追繳與斷頭** —— 真實個股期在權益
      跌破維持保證金時會被強制平倉，回撤路徑會比模擬更糟，2.5x 以上可能直接出場
    - 個股期真正的成本是買賣價差不是手續費；只有約 103 檔日成交 >500 口
    - 每月結算需轉倉，轉倉成本與價差未計入
    - 流動性快照只有「今天」，期交所 OpenAPI 沒有歷史 → 回測用 PIT 代理近似
    - 個股期同樣有 ±10% 漲跌幅，鎖漲停買不到的問題與現股相同

# ═════════════════════════════════════════════
# 第 3 套策略：低位階籌碼清洗（2026-09-03 新增）
#
# 與前兩套完全獨立，只共用 taiwan/python/ 的資料層。
# 想抓的狀態：股價在低位階但已止跌、融資（散戶槓桿）退潮、量能還沒放大、
#            月營收在成長，而法人正在這種沒量的盤裡默默吃貨。
#
# ★ 先講清楚先驗是負面的：
#   本專案自己的證據站在反面。P0 全市場回測顯示 PF 隨市值單調遞增
#   （Q1 最小 1.151 → Q4 權值 1.923），低位階冷門股是最差的一區；
#   動能策略的 position 分項更是直接獎勵「貼近 52 週高點」，與本策略相反。
#   所以這套不是「有把握所以做」，是「使用者要驗證這個想法所以做」。
#   status 在跑出數字之前一律 untested。
# ═════════════════════════════════════════════
taiwan_washout:
  label: 台股低位階籌碼清洗
  status: rejected            # validated | marginal | rejected | untested
  # 2026-09-03 全市場回測完成，見 taiwan/WASHOUT_RESULTS.md。
  # 照原構想（四道門檻全開）每筆平均**輸給**等權買進持有 0.37%，
  # 25 檔投組 CAGR 只有 5.8%（基準 19.0%）。拒絕。
  # ★ 但拒絕的是這個「具體組合」，不是「基本面好而市場未發現」這個一般命題 ——
  #   關鍵資料（集保大戶、毛利率/EPS）目前拿不到，那部分根本還沒被測到。
  exchange: TWSE
  timeframe: 1D

  costs:
    commission_pct_per_side: 0.3     # 同其餘台股策略：來回約 0.585%
    initial_capital: 1000000
    currency: TWD

  params:
    # ── 流動性（先濾再排名，理由同 momentum.py）──
    # 沿用動能策略的 2000 萬，讓兩套策略的「可買性」標準一致。
    # 本策略選的本來就是低量股，這條是「人真的買得到」的下限，不是選股條件。
    min_turnover: 20000000
    turnover_window: 20

    # ── 硬門檻 1：位階帶 + 止跌 ──
    # 帶狀而非「越低越好」：pos 太高＝已發酵（那是動能的守備範圍），
    # 太低＝還在跌（接刀）。low_margin 是「不再破底」的判定。
    high_window: 250                 # 一年高低點（台股一年約 245 個交易日）
    pos_lo: 0.45                     # 收盤 / 一年最高 的下限
    pos_hi: 0.85                     #                  的上限
    low_window: 60                   # 近 60 日視為「打底區間」
    low_margin: 0.05                 # 近 60 日最低要高於一年最低 5% 以上

    # ── 硬門檻 2：市場未發酵 ──
    # ★ 這是策略的定義性條件，也是最大的執行風險：不知道要等多久，可能不發酵。
    #   max_hold_days 的時間出場就是在量測這件事的代價。
    vol_fast: 5
    vol_slow: 60
    vol_ratio_max: 1.30              # 5 日均額 / 60 日均額 上限（量還沒放大）
    recent_window: 20
    recent_run_max: 0.15             # 近 20 日漲幅上限（還沒起漲）

    # ── 硬門檻 3：基本面（月營收）──
    # ★ 只有成長性，沒有獲利品質。MOPS 改版後季報端點連不上（實測 TLS reset），
    #   只有月營收靜態檔可取 → 一家虧損但營收成長的公司同樣會通過。已知缺口。
    min_yoy: 0.0                     # 近 3 月營收年增率平均要 > 0
    min_pos_months: 2                # 近 3 個月至少 2 個月年增為正

    # ── 分項（權重加總須為 1.0）──
    weights:
      washout: 0.30                  # 融資退潮幅度「超出」股價跌幅多少
      accum: 0.30                    # 法人淨買佔成交量比重（吸籌）
      fund: 0.25                     # 月營收年增率（近 3 月平均）的全市場百分位
      base: 0.15                     # 波動收斂程度（打底品質）

    margin_window: 60                # 融資變化與股價變化用同一個回看期
    min_margin_lots: 500             # 融資餘額太小的股票不談「清洗」，濾掉
    accum_window: 60                 # 法人淨買 / 成交量 的累計視窗

    ma_set: [5, 10, 20, 60]

    # ── 進出場 ──
    # ★ 出場設計是本策略最沒把握的部分，三種模式都要掃過再定：
    #   time      純時間出場 —— 最乾淨的基準，回答「等下去到底有沒有用」
    #   ma        收盤跌破 MA_n 出場 —— 打底期價格本來就在均線上下震盪，
    #             預期會被洗來洗去，放進來當對照組
    #   armed_ma  漲幅先達 arm_pct 才啟用跌破 MA_n 出場（等發酵，發酵後才管理）
    #             這是最貼合策略意圖的一種，但也最像事後配適，要特別小心
    entry_score: 8.0                 # 分數上穿此值 → 隔日開盤進場
    exit_mode: armed_ma
    exit_ma: 20
    arm_pct: 0.15                    # armed_ma 模式：獲利 15% 後才啟用均線出場
    stop_loss_pct: 15                # 硬停損 −15%（低位階已跌多，不需要 20%）
    max_hold_days: 120               # 約半年。0 = 不限
    limit_up_guard: true             # 隔日鎖漲停買不到 → 略過該筆

    # 消融開關（見下方消融實驗結論）。可填 posband / stopfall / dormant / fund。
    # 想跑「唯一贏過買進持有」的那組：["posband", "dormant"]
    # 或不改這裡，直接 washout_screen.py --relaxed
    disable_gates: []

  # ── 消融實驗結論（2026-09-03）──
  # 逐一拆掉硬門檻，用「超額報酬（贏等權買進持有多少）」當判準，25 檔投組：
  #   四道全開                 超額 −0.37%  CAGR  5.8%  回撤 19.8%  曝險 45%
  #   拆 posband（位階帶）      超額 +0.46%  CAGR 16.6%  回撤 18.0%
  #   拆 dormant（未發酵）      超額 +0.27%  CAGR  9.4%
  #   拆 stopfall（止跌）       超額 −0.32%  ← 大致中性
  #   拆 fund（營收）           超額 −0.39%  ← 零貢獻，這條門檻太鬆（55% 都過）
  #   拆 posband + dormant     超額 +0.83%  CAGR 18.6%  回撤 17.9%  曝險 80%  ★最佳
  # → **策略的兩個定義性條件（低位階、未發酵）正好是拖累績效的那兩個。**
  #   拆掉後報酬打平大盤、回撤砍半，但選出來的已經不是低位階股了。
  # 分項：accum（法人吸籌）唯一明顯正貢獻（PF 1.615、中位 +2.39%）；
  #       base（波動收斂）有害（超額 −1.29%）；washout（融資清洗）接近中性。
  # 分數：門檻 5.0~9.0 掃過，PF 與超額都無單調性 —— 加權排名那一層沒有資訊，
  #       「門檻過就買」（不用分數）的超額 +0.24% 反而比大多數門檻設定好。
  benchmark:
    scope: 全市場 1,078 檔（含期間內下市，無倖存者偏差）
    period: 2019-01-02 ~ 2026-09-01
    entry_score: 8.0
    exit: armed_ma / MA20 / arm 15% / 停損 15% / 上限 120 日
    trades: 476
    win_rate_pct: 49.37
    profit_factor: 1.332
    avg_net_pct_per_trade: 2.298
    median_hold_days: 34
    # ★ 判準是超額不是 PF。同期間等權買進持有基準：CAGR 19.02%、最大回撤 34.09%。
    buy_and_hold_avg_pct_per_trade: 2.664
    excess_avg_pct_per_trade: -0.365     # ← 負的。這就是 rejected 的理由
    beat_benchmark_pct: 39.9
    portfolio_25_slots: {cagr_pct: 5.77, max_dd_pct: 19.75, avg_exposure_pct: 45.1}

  caveats:
    - ★ 每筆平均輸給等權買進持有 0.37%，投組 CAGR 5.8% vs 基準 19.0% —— 不要照原設定用
    - ★ 與 P0 結論方向相反（低位階冷門股在全市場回測是最差的一區），先驗為負面
    - 「單一投資人大幅度看好」只能用法人買超佔量比代理 —— TDCC 集保大戶
      的 opendata 只回最新一週、無歷史（2026-09-03 實測），非法人的大戶抓不到
    - 「基本面」只涵蓋營收成長，不含毛利率／EPS／負債（MOPS 季報端點連不上）
    - 融資餘額單位是「交易單位（張）」，與 chips 的股數不同，只用相對變化率
    - 未發酵＝不知道要等多久，時間出場的比例會很高，資金效率是主要風險

# ─────────────────────────────────────────────
# 大盤狀態（market regime）—— 讓策略依大盤動能與方向動態調整（2026-09-04 新增）
#
# 動機：動能策略在空頭會被反覆巴掌。分年 PF 只有 2022 是虧的（0.57），那正是空頭年。
# 實測把交易依進場當天的大盤狀態分組，分得非常乾淨：
#     弱  245 筆  PF 0.848  勝率 33.5%  平均 −0.63%   ← 弱勢時進場是**虧錢**的
#     中  701 筆  PF 1.546  勝率 42.4%  平均 +2.08%
#     強 1106 筆  PF 1.552  勝率 42.5%  平均 +2.38%
# 弱勢只佔 18% 的交易日，卻是整組回撤的主要來源。
taiwan_market:
  label: 大盤狀態
  params:
    # ── 寬度（主要訊號）──
    # 全市場（過流動性門檻者）站上自身 MA_n 的比例。
    # ★ 完全不需要新資料源，用現成的行情快取就算得出來。
    # 寬度常比指數本身早轉向 —— 指數被權值股撐住、但多數股票已走弱時，
    # 動能策略會先受傷，指數卻還沒跌。
    breadth_ma: 60          # 20/40/60 實測都不敏感（比值 1.69~1.78），120 才變差（1.42）
    breadth_weak: 0.40      # ★ 不是挑最高分：40% 正好是「被排除的那批 PF 掉到 1 以下」
                            #   的位置（<40% 那批 PF 0.848）。改 45% 就開始砍到賺錢的單
                            #   （被排除的 PF 變成 1.086）。這是有原則的切點。
    breadth_strong: 0.60    # 中/強兩組的每筆品質其實幾乎一樣（1.546 vs 1.552），
                            # 這條線的作用是「加碼」不是「篩選」。

    # ── 指數趨勢 ── ★ 實測沒有加分，預設不參與分級，只拿來顯示給人看。
    # 加了指數之後「弱勢」那組的 PF 由 0.848 升到 1.091 —— 也就是開始把**賺錢的單**
    # 判成弱勢而讓你錯過。三種來源實測（15 檔、弱0/中1.5/強2.5）：
    #     寬度only   弱勢PF 0.848  CAGR 72.9%  回撤 43.1%  比值 1.69   ← 採用
    #     寬度+指數  弱勢PF 1.091  CAGR 63.2%  回撤 39.5%  比值 1.60
    #     指數only   弱勢PF 1.133  CAGR 72.1%  回撤 43.2%  比值 1.67
    # 直覺上「大盤跌破均線就別做」很合理，但寬度已經把這件事做得更好、而且更早。
    use_index: false
    index_ma: 60
    index_slope_lookback: 5   # 要求均線本身也在上揚，避免「剛跌破又彈回」反覆切換

  caveats:
    - 門檻與槓桿對照表都是 in-sample 挑的，與其他參數一樣沒做樣本外
    - 指數快取（market.py）目前只用於畫面顯示，不影響任何決策 —— 想改回參與分級把 use_index 設 true
    - 寬度是「當天收盤後」才算得出來，隔日開盤進場沒有前視問題，但盤中無法即時判斷
    - 2022 只被改善到 PF 0.75~1.23（視門檻），**沒有被完全修好**

# ═════════════════════════════════════════════
# 大戶籌碼輪動選股（2026-09-05 新增）
#
# 不是完整策略，是**每週看一次的雷達**：找「籌碼集中度在升 + 成交量在放大」的標的。
# 資料來自神秘金字塔（twsthr.info）整理的 TDCC 集保週資料，見 pyramid.py。
#
# ★★ 這套**完全沒有回測過**。放進來是因為使用者要一份每週清單，
#    不是因為有證據。本專案的規矩是「先讓它跑出數字」——
#    在 WASHOUT_RESULTS.md 那種等權買進持有基準下驗過之前，
#    不要假設籌碼集中會帶來超額報酬。低位階策略就是這樣被推翻的。
# ═════════════════════════════════════════════
taiwan_chip_rotation:
  label: 台股大戶籌碼輪動
  status: untested            # validated | marginal | rejected | untested
  exchange: TWSE
  timeframe: 1W               # 集保資料是週頻（每週五）

  costs:
    commission_pct_per_side: 0.3
    initial_capital: 1000000
    currency: TWD

  params:
    # ── 流動性（先濾再排名，理由同 momentum.py）──
    min_turnover: 20000000
    turnover_window: 20

    # ── 集中度的回看週數 ──
    # 4 週約一個月。太短（1~2 週）會抓到單週雜訊，太長會變成「早就集中完了」。
    lookback_weeks: 4

    # ── 硬門檻 ──
    require_big400_up: true      # >400 張大戶持股比例必須是上升的
    require_holders_down: true   # 總股東人數必須是減少的（籌碼確實在集中）
    vol_ratio_min: 1.15          # 5 日均額 / 60 日均額 —— 量要真的變多
    # ★ 排除公司事件：公開收購／合併會讓大戶比例單週跳 50 個百分點
    #   （實測 1563 巧新 2026-09-04 由 49.69% 跳到 100%）。
    #   那是真資料但不是「有人在收貨」，選股清單一定要濾掉，否則排行前幾名全是它們。
    max_abs_change: 15.0         # 回看期內大戶比例變化超過 ±15 個百分點 → 剔除

    # ── 分數（權重加總須為 1.0，全部為橫斷面百分位）──
    weights:
      big400_chg: 0.40           # >400 張大戶持股比例變化（百分點）
      holders_chg: 0.20          # 總股東人數變化率（減少者高分）
      big1000_chg: 0.15          # 千張大戶持股比例變化（百分點）
      volume: 0.25               # 量能放大倍數

    entry_score: 7.5             # 清單門檻。★ 未經回測，不是最佳化出來的數字

  caveats:
    - ★ 完全未回測 —— 沒有任何證據顯示籌碼集中會帶來超額報酬
    - 資料來自第三方（神秘金字塔）整理的 TDCC 資料，非官方原始檔，版面改版會壞
    - 週資料只回溯到 2023-05（約 170 週），比其餘策略的 2019 起短很多
    - 「大戶」含保管銀行帳戶（外資託管都掛這裡），不等於自然人大戶；
      外資換託管行會讓比例跳動，看起來像有人收貨
    - 集保資料每週五更新，週間看到的是上週五的狀態，最多落後 5 個交易日

# ============================================================
# 台股全域排除（2026-09-15，使用者指示：之後都不要這些類股）
# 套用在 twse.load_bars —— 布林縮口、動能選股的「選股」與「回測」全部生效。
# ============================================================
taiwan_exclude:
  # 金融保險業（產業代碼 17）：銀行、金控、保險、證券、票券，上市 31＋上櫃 9 檔
  # 生技醫療（22）、文化創意（32）：2026-09-22 使用者要求踢除「連續性不好」的類股。
  #   依 industry_continuity.py，全市場「漲幅前 20% 的股票接下來 20 日相對大盤超額」
  #   只有這兩個在 2019-22、2023-26 兩段都為負且樣本夠（639／115 筆）。
  #   ★ 整體而言產業續漲性前後段幾乎不相關（r=-0.15），其他產業不要只憑一段期間就踢。
  industries: ["17", "22", "32"]
  # 電信業者只能逐檔列：它們跟智邦、宏達電、明泰等網通設備廠同屬「通信網路業(27)」
  # 共 91 檔，整類踢會連網通股一起砍掉
  codes:
    - "2412"   # 中華電
    - "3045"   # 台灣大
    - "4904"   # 遠傳

# ─────────────────────────────────────────────
# 崩盤反彈（大盤負乖離）—— 2026-09-21 新增，與動能策略合併使用
#
# 起點是一次乖離率研究（1,045 檔、2019~2026，已排除金融電信）：
#   ① 乖離「當選股工具」沒有用。BIAS20 ≤ −20% 逐筆看平均 +10.5%，但 4,707 筆只來自
#      511 天、最集中的 5 天佔 30%（2025-04 關稅崩盤、2020-03、2021-05）。
#      改成每天等權只剩 +1.47%；大盤平靜時買最超跌的股票是虧的。
#   ② 乖離「當大盤擇時用」有用而且單調：每天挑最超跌 5 檔、持有 10 天，依大盤自身 BIAS20 分組
#        ≤−10%  15天 +16.94% 勝率87%　│　−10~−6%  33天 +4.85% 67%
#        −6~−3% 114天  +2.17%  63%　 │　−3~0%   324天 −0.69% 48%　│　>+3% 161天 −1.78% 35%
#   ③ 失敗型態明確：V 型急殺會彈，慢性空頭不會（2022 大盤一路超跌、只打平）。
#
# 定位：動能策略在大盤「弱」時停手（弱勢進場 PF 0.848），這些崩盤日幾乎都落在「弱」——
#       反彈單剛好用掉那段閒置的保證金。兩者互補，而不是疊加。
taiwan_rebound:
  label: 崩盤反彈（大盤負乖離）
  # ★ 2026-09-21 使用者決定「先不上」—— 只做動能期貨。研究與程式保留，
  #   但未接進任何選股流程或選單（momentum_plan.py 本來就不讀這個區塊）。
  status: shelved             # 回測有效但只有 6 次崩盤樣本；使用者暫不採用
  exchange: TAIFEX
  timeframe: 1D
  costs:
    commission_pct_per_side: 0.05      # 同 taiwan_futures（個股期）
    initial_capital: 1000000
    currency: TWD
  params:
    index_bias_ma: 20
    # ★ index_trigger：掃過 −3／−6／−8，每筆品質隨門檻變嚴單調上升（PF 約 1.8 → 2.1~3.6 → 6~9）。
    #   決定性的比較是「合併投組 vs 動能直接加槓桿到同樣回撤」—— 這才是公平的對手：
    #       −3%  合併 CAGR 112.7%  vs  動能×1.64 141.6%   → −28.9pp（不如直接加槓桿）
    #       −6%  合併 CAGR 103.0%  vs  動能×1.38 112.6%   →  −9.6pp（不如直接加槓桿）
    #       −8%  合併 CAGR 109.4%  vs  動能×0.96  71.4%   → +38.0pp  ← 唯一真正加分
    #   −8% 的 6 次崩盤全部賺錢；拿掉最關鍵的 2024-08 後報酬/回撤仍 3.41（動能單獨 2.71）。
    #   ★ 但只有 6 次事件（約每年 0.8 次），樣本極薄。
    index_trigger: -8.0                # 大盤 BIAS20 ≤ 此值才出手
    stock_bias_ma: 20
    stock_max_bias: -10.0              # 個股 BIAS20 須 ≤ 此值才算超跌
    picks_per_day: 5                   # 每個觸發日最多挑幾檔（最超跌者優先）
    # hold_days：5 < 10 < 20 在每個觸發門檻下都單調變好（−8%：PF 2.38 / 6.01 / 9.05）。
    #   ★ 20 天超出動能那邊的 3~14 天窗口。硬要守窗口就改 10：合併 CAGR 97.9%、回撤 29.5%，
    #     仍勝過動能單獨（報酬/回撤 3.32 vs 2.71），只是比 20 天差。
    hold_days: 20
    # exit_mode：time 與 revert（站回 MA20 提早出）結果幾乎相同，取簡單的 time。
    exit_mode: time                    # time＝滿 hold_days 出場；revert＝站回 MA20 就出場（或滿期）
    stop_loss_pct: 20
    slots: 5                           # 同時最多持有幾檔
    leverage: 1.5
    pit_universe_rank: 150             # 與 taiwan_futures 同一個點時間流動性代理
